<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Market</title>
    <link href="style/output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"

    <link rel="stylesheet" href="/style/stylecust.css">

</head>

<body class="bg-gray-900">

    <dotlottie-player id="lottie-player" style="position: fixed; z-index: 10; cursor: pointer; z-index: 5000;"
        src="https://lottie.host/833cd667-c5e4-4959-9e6d-06e47cf02925/HKjm8waBqx.lottie" background="#4E3A81"
        speed=".102" style="width: 300px; height: 300px" width=""></dotlottie-player>
    <!-- nav -->
    <div class="flex justify-center">
        <nav id="header"
            class="container mx-auto flex items-center justify-between md:px-0 !ps-2 !pe-4 !-top-[2.5px] z-50">
            <div>
                <img src="image/logo.png" alt="" width="90">
            </div>
            <div id="links_nav"
                class=" link_glass glass_link before:top-0.5 pt-2 pb-2 px-15 relative !flex items-center gap-2 me-1">
                <a href="#apple" onmouseover="this.classList.remove('glass_link')"
                    onmouseout="this.classList.add('glass_link')"
                    class="!text-[#4400ff59] font-bold link_nav link_glass glass_link hidden  apple p-3 flex items-center justify-center !rounded-b-none after:!rounded-b-none before:!rounded-b-none  ">Apple</a>

                <a href="#android" onmouseover="this.classList.remove('glass_link')"
                    onmouseout="this.classList.add('glass_link')"
                    class="!text-[#4400ff59] font-bold link_nav link_glass glass_link hidden  android p-3 flex items-center justify-center !rounded-b-none after:!rounded-b-none before:!rounded-b-none  ">Android</a>
            </div>
            <div id="div_search"
                class="w-9 h-10 flex items-center glass px-2  transition-all duration-1000 ease-[cubic-bezier(0.36,0,0.66,-0.56)] cursor-pointer">
                <i id="icon_search" class="fa-brands fa-searchengin text-2xl  !text-[#ffffff63]"></i>
                <input id="input_search" class=" outline-none w-full p-2 hidden" type="search" name="" id=""
                    placeholder="Search">
            </div>
        </nav>

        <!-- shopping button -->
        <div id="button_shopping" class="!fixed bottom-5 left-5 glass p-4 flex items-center cursor-pointer z-200">
            <span id="total_shopping"
                class="!flex !items-center py-.5 px-1.5 text-sm bg-red-500 !absolute rounded-full top-1.5 left-1.5 animate-pulse">0</span>
            <i class="fa-solid fa-cart-shopping"></i>
        </div>

        <!-- menu -->
        <div class="!fixed bottom-5 right-5 flex items-center flex-row-reverse z-40">
            <div id="button_menu" class="glass glass_carusel px-4 py-5  flex items-center cursor-pointer"
                onclick="this.classList.toggle('!rounded-s-none')
                          this.classList.toggle('after:!rounded-s-none')
                          this.classList.toggle('before:!rounded-s-none')
                          this.nextElementSibling.classList.toggle('hidden')
                          setTimeout(() => {
                            this.nextElementSibling.classList.toggle('w-full')
                          }, 50);">
                <i class="fa-solid fa-bars"></i>
            </div>
            <div
                class="glass glass_carusel w-0 hidden transition-[width] duration-1000 flex-row-reverse p-3 flex items-center gap-1 !rounded-e-none after:!rounded-e-none before:!rounded-e-none">
                <a href="/pages/add.html" class="glass glass_carusel p-2 flex items-center hover:cursor-pointer"
                    onmouseover="this.classList.remove('glass_carusel')"
                    onmouseout="this.classList.add('glass_carusel')">
                    <svg width="15px" height="15px" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 16H1L1 9H3L3 14H13V9H15L15 16Z" fill="#ffffff6b" />
                        <path d="M12 6L9 6L9 1.74846e-07L7 0V6L4 6L4 7L8 11L12 7L12 6Z" fill="#ffffff6b" />
                    </svg>
                </a>

                <a href="/pages/edit&delete.html"
                    class="glass glass_carusel p-2 flex items-center gap-1 text-[15px] !text-[#ffffff6b] hover:cursor-pointer"
                    onmouseover="this.classList.remove('glass_carusel')"
                    onmouseout="this.classList.add('glass_carusel')">
                    <i class="fas fa-edit"></i>
                    <i class="fa-solid fa-trash"></i>
                </a>

                <a href="/pages/shopping.html"
                    class="glass glass_carusel p-2 flex items-center gap-1 text-[15px] !text-[#ffffff6b] hover:cursor-pointer"
                    onmouseover="this.classList.remove('glass_carusel')"
                    onmouseout="this.classList.add('glass_carusel')">
                    <i class="fa-solid fa-bag-shopping"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- Review -->
    <section id="review" class="container mx-auto px-2 md:px-0  flex">
        <div class="w-3/5  mx-auto md:mr-0 md:ml-15">
            <!-- Left -->
            <div id="default-carousel" class="relative w-full glass glass_carusel" data-carousel="slide">
                <!-- Carousel wrapper -->
                <div class="relative h-56 overflow-hidden rounded-lg md:h-96">
                    <!-- Item 1 -->
                    <div class="hidden duration-700 ease-in-out" data-carousel-item>
                        <img src="/image/image.png"
                            class="absolute block  h-full  object-contain pb-8 -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2"
                            alt="...">
                    </div>
                    <!-- Item 2 -->
                    <div class="hidden duration-700 ease-in-out" data-carousel-item>
                        <img src="/image/iphone2.png"
                            class="absolute block h-full   object-contain pb-8 -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2"
                            alt="...">
                    </div>
                    <!-- Item 3 -->
                    <div class="hidden duration-700 ease-in-out" data-carousel-item>
                        <img src="/image/sm-ultra.png"
                            class="absolute block h-full object-contain pb-8 -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2"
                            alt="...">
                    </div>
                    <!-- Item 4 -->
                    <div class="hidden duration-700 ease-in-out" data-carousel-item>
                        <img src="/image/sm-ultra2.png"
                            class="absolute block h-full  object-contain pb-10 -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2"
                            alt="...">
                    </div>
                </div>
                <!-- Slider indicators -->
                <div class="absolute z-30 flex -translate-x-1/2 bottom-5 left-1/2 space-x-3 rtl:space-x-reverse">
                    <button type="button" class="w-5 h-3 rounded-full glass  !bg-gray-700" aria-current="true"
                        aria-label="Slide 1" data-carousel-slide-to="0"></button>
                    <button type="button" class="w-5 h-3 rounded-full glass !bg-gray-700" aria-current="false"
                        aria-label="Slide 2" data-carousel-slide-to="1"></button>
                    <button type="button" class="w-5 h-3 rounded-full glass !bg-gray-700" aria-current="false"
                        aria-label="Slide 3" data-carousel-slide-to="2"></button>
                    <button type="button" class="w-5 h-3 rounded-full glass !bg-gray-700" aria-current="false"
                        aria-label="Slide 4" data-carousel-slide-to="3"></button>
                </div>
                <!-- Slider controls -->
            </div>

        </div>

        <!-- Right -->

        <div class="w-4/12 lg:w-3/12 glass glass_carusel flex justify-center md:ml-5">

            <div id="default-carousel" class="relative w-full" data-carousel="slide" data-carousel-interval="5000">

                <div class="relative h-56 overflow-hidden rounded-lg md:h-96">

                    <div class="hidden duration-700 ease-in-out" data-carousel-item>
                        <img src="/image/iphone3.png"
                            class="absolute block  h-full ml-5  object-contain  -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2"
                            alt="...">
                    </div>

                    <div class="hidden duration-700 ease-in-out" data-carousel-item>
                        <img src="/image/iphone4.png"
                            class="absolute block  h-full   object-contain  -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2"
                            alt="...">
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- item apple -->
    <section id="apple" class="container mx-auto mt-5 xxxs:mt-19 w-full !relative px-1 xxs:mt-45 md:px-0">
        <div class=" mySwiper">
            <div class="swiper-wrapper flex flex-col">

                <!-- offer tag-->
                <div
                    class="offer w-fit p-3 flex items-center left-4 font-semibold h-fit  glass glass_carusel !rounded-b-none">
                    Apple Offers
                </div>
                <!-- Arrow -->
                <div class="w-50  flex flex-row-reverse gap-4 !absolute right-0 me-10 z-10 top-1">
                    <span onmouseover="this.classList.remove('glass_carusel')"
                        onmouseout="this.classList.add('glass_carusel')"
                        class="button-next text-2xl glass glass_carusel  w-11 h-11 !flex !justify-center !items-center hover:cursor-pointer !rounded-b-none"><i
                            class="fa-solid fa-location-arrow" style="rotate: 44deg;"></i></span>
                    <span onmouseover="this.classList.remove('glass_carusel')"
                        onmouseout="this.classList.add('glass_carusel')"
                        class="button-prev text-2xl glass glass_carusel  w-11 h-11 !flex !justify-center !items-center hover:cursor-pointer !rounded-b-none"><i
                            class="fa-solid fa-location-arrow" style="rotate: 226deg;"></i></span>
                </div>
                <!-- Items carusel -->
                <div class=" glass glass_carusel">
                    <div class="flex  swiper mySwiper  !p-4">
                        <div id="apple_offers" class="swiper-wrapper  mx-auto">
                            <!-- item apple offer js -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- items -->
        <div class="relative mt-10 after_connect z-10">
            <div class="after_connect_child"></div>
            <div id="item_apple_continar_parent" class="h-4 !overflow-hidden">
                <div id="item_apple_continar_child"
                    class="glass glass_carusel flex items-center h-4 py-2 !overflow-hidden">
                    <div id="item_apple_continar"
                        class=" mt-[.499px] before:!top-1 before:!shadow-[0_-20px_30px_rgba(236,233,233,0.486)]  h-0 transition-all duration-1000 ">
                        <div id="item_apple" class="flex  !p-4 gap-2 flex-wrap">
                            <!-- items apple js -->
                        </div>

                    </div>
                </div>
            </div>
            <div _id_parent="item_apple_continar_parent" The_special_word="apple"
                class="button_show_more !relative bottom-0.5 z-100 w-fit p-3 flex items-center left-4 font-semibold h-fit  glass glass_carusel !rounded-t-none after:!rounded-t-none before:!rounded-t-none">
                Show More
            </div>
        </div>

    </section>




    <!-- item android -->
    <section id="android" class="container mx-auto mt-5 w-full !relative px-1  md:px-0">
        <div class=" mySwiperAndroid">
            <div class="swiper-wrapper flex flex-col">

                <!-- offer tag-->
                <div
                    class="offer w-fit p-3 flex items-center left-4 font-semibold h-fit  glass glass_carusel !rounded-b-none">
                    android Offers
                </div>
                <!-- Arrow -->
                <div class="w-50  flex flex-row-reverse gap-4 !absolute right-0 me-10 z-10 top-1">
                    <span onmouseover="this.classList.remove('glass_carusel')"
                        onmouseout="this.classList.add('glass_carusel')"
                        class="button-next-Android text-2xl glass glass_carusel  w-11 h-11 !flex !justify-center !items-center hover:cursor-pointer !rounded-b-none"><i
                            class="fa-solid fa-location-arrow" style="rotate: 44deg;"></i></span>
                    <span onmouseover="this.classList.remove('glass_carusel')"
                        onmouseout="this.classList.add('glass_carusel')"
                        class="button-prev-Android text-2xl glass glass_carusel  w-11 h-11 !flex !justify-center !items-center hover:cursor-pointer !rounded-b-none"><i
                            class="fa-solid fa-location-arrow" style="rotate: 226deg;"></i></span>
                </div>
                <!-- Items carusel -->
                <div class=" glass glass_carusel">
                    <div class="flex  swiper mySwiperAndroid  !p-4">
                        <div id="android_offers" class="swiper-wrapper  mx-auto">

                            <!-- items offer android js -->

                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- items -->
        <div class="relative mt-10 after_connect z-10">
            <div class="after_connect_child"></div>
            <div id="item_android_continar_parent" class="h-4 !overflow-hidden">
                <div id="item_android_continar_child"
                    class="glass glass_carusel flex items-center h-4 py-2 !overflow-hidden">
                    <div id="item_android_continar"
                        class=" mt-[.499px] before:!top-1 before:!shadow-[0_-20px_30px_rgba(236,233,233,0.486)]  h-0 transition-all duration-1000 ">
                        <div id="item_android" class="flex  !p-4 gap-2 flex-wrap">
                            <!-- items apple js -->
                        </div>

                    </div>
                </div>
            </div>
            <div _id_parent="item_android_continar_parent" The_special_word="android"
                class="button_show_more !relative bottom-0.5 z-100 w-fit p-3 flex items-center left-4 font-semibold h-fit  glass glass_carusel !rounded-t-none after:!rounded-t-none before:!rounded-t-none">
                Show More
            </div>
        </div>

    </section>



    <!-- shopping -->
    <div id="shopping_continar"
        class="transition-all duration-500 ease-in-out h-screen glass glass_carusel w-3/4  sm:w-1/2 md:w-2/5 lg:w-1/3 xl:w-1/4 -right-full !rounded-r-none after:!rounded-r-none before:!rounded-r-none !fixed top-0 z-50">
        <div id="shopping" class="py-5 flex flex-col gap-2 max-h-screen !overflow-y-auto !max-h-15/16">
            <!-- items shopp -->

        </div>
        <div id="total_price_parent"
            class="glass glass_carusel flex justify-center items-center p-2 !text-[#ffffff85] font-semibold !rounded-r-none after:!rounded-r-none before:!rounded-r-none">
            total $<span id="total_price">0</span>
        </div>
    </div>

    <!-- details product -->
    <div id="details"
        class="fixed top-0 left-0 w-screen h-screen flex items-center justify-center sm:p-10 z-2000 hidden">
        <div class="glass glass_carusel w-full p-5 flex items-center">


            <div id="default-carousel" class="relative !w-1/2" data-carousel="slide">
                <!-- Carousel wrapper -->
                <div class="imagesProduct relative h-56 overflow-hidden rounded-base md:h-96 ">
                    <!-- images -->
                    <div class="hidden duration-700 ease-in-out" data-carousel-item>
                        <img src="/pages/image_glass/glassimage.jpg"
                            class="absolute block w-1/2 h-1/2 sm:w-full sm:h-full object-contain -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2"
                            alt="...">
                    </div>
                </div>
                <!-- Slider indicators -->
                <!-- <div class="absolute z-30 flex -translate-x-1/2 bottom-5 left-1/2 space-x-3 rtl:space-x-reverse">
                    <button type="button" class="w-3 h-3 rounded-base" aria-current="true" aria-label="Slide 1"
                        data-carousel-slide-to="0"></button>
                    <button type="button" class="w-3 h-3 rounded-base" aria-current="false" aria-label="Slide 2"
                        data-carousel-slide-to="1"></button>
                    <button type="button" class="w-3 h-3 rounded-base" aria-current="false" aria-label="Slide 3"
                        data-carousel-slide-to="2"></button>
                    <button type="button" class="w-3 h-3 rounded-base" aria-current="false" aria-label="Slide 4"
                        data-carousel-slide-to="3"></button>
                    <button type="button" class="w-3 h-3 rounded-base" aria-current="false" aria-label="Slide 5"
                        data-carousel-slide-to="4"></button>
                </div> -->
                <!-- Slider controls -->
                <button type="button"
                    class="absolute top-0 start-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
                    data-carousel-prev>
                    <span
                        class="inline-flex items-center justify-center w-3 h-3 sm:w-7 sm:h-7 md:w-10 md:h-10 rounded-base bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none">
                        <svg class="w-3 h-3 sm:w-4 sm:h-4 md:w-5 md:h-5 text-white rtl:rotate-180" aria-hidden="true"
                            xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="m15 19-7-7 7-7" />
                        </svg>
                        <span class="sr-only">Previous</span>
                    </span>
                </button>
                <button type="button"
                    class="absolute top-0 end-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
                    data-carousel-next>
                    <span
                        class="inline-flex items-center justify-center w-3 h-3 sm:w-7 sm:h-7 md:w-10 md:h-10 rounded-base bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none">
                        <svg class="w-3 h-3 sm:w-4 sm:h-4 md:w-5 md:h-5 text-white rtl:rotate-180" aria-hidden="true"
                            xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="m9 5 7 7-7 7" />
                        </svg>
                        <span class="sr-only">Next</span>
                    </span>
                </button>
            </div>


            <div class="textTitle w-1/2 text-center font-bold !text-[#ffffff8a]">
                Apple iPhone 16 Pro Max – Stunning 6.9-inch display, Titanium design, advanced triple camera system.
            </div>

            <!-- Close -->
            <div class="glass glass_carusel !text-[#ffffff42] p-2 flex items-center !text-2xl hover:cursor-pointer !absolute
                        top-1 right-0.5" onmouseover="this.classList.remove('glass_carusel')"
                onmouseout="this.classList.add('glass_carusel')"
                onclick="document.getElementById('details').classList.add('hidden')">
                <i class="far fa-times-circle"></i>
            </div>
        </div>
    </div>


    <div class="glass glass_carusel before:!bg-transparent  after:!bg-transparent flex items-center justify-center p-1.5 text-[13px]
                !rounded-s-none after:!rounded-s-none before:!rounded-s-none
                !rounded-e-none after:!rounded-e-none before:!rounded-e-none">

    </div>
