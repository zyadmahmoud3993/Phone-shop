<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping</title>
    <link href="/../style/output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/../style/swiper.css">
    <link rel="stylesheet" href="/../style/stylecust.css">
    <link rel="icon" type="image/png" href="/image/logo.png"/>
</head>

<body class="bg-gray-900">
    <!-- nav -->
    <div class="flex justify-center">
        <nav id="header"
            class="container mx-auto flex items-center justify-between md:px-0 !ps-2 !pe-4 !-top-[2.5px] z-50">
            <div>
                <img src="/../image/logo.png" alt="" width="90">
            </div>
            <div id="links_nav"
                class=" link_glass glass_link before:top-0.5 pt-2 pb-2 px-15 relative flex items-center me-1">
                <a href="#apple" onmouseover="this.classList.remove('glass_link')"
                    onmouseout="this.classList.add('glass_link')"
                    class="!text-[#4400ff59] font-bold link_nav link_glass glass_link hidden  apple p-3 flex items-center justify-center !rounded-b-none after:!rounded-b-none before:!rounded-b-none  ">Apple</a>
            </div>
            <div id="div_search"
                class="w-9 h-10 flex items-center glass px-2  transition-all duration-1000 ease-[cubic-bezier(0.36,0,0.66,-0.56)]">
                <i id="icon_search" class="fa-brands fa-searchengin text-2xl  !text-[#ffffff63]"></i>
                <input id="input_search" class=" outline-none w-full p-2 hidden" type="search" name="" id=""
                    placeholder="Search">
            </div>
        </nav>


    </div>

    <div class="flex justify-center flex-wrap items-center lg:flex-nowrap">
        <!-- items edit or delete -->
        <div class=" !max-h-[calc(142px*3)] overflow-y-scroll w-full lg:me-5 xl:me-0 md:w-3/4 lg:w-2/5 rounded-2xl">
            <div id="items"
                class="text-white glass glass_carusel flex flex-col justify-center gap-2 items-center py-3">

            </div>
        </div>


        <div
            class="flex justify-center   w-1/2 items-center lg:ms-5 flex-wrap xs:flex-nowrap mb-2 lg:flex-nowrap mt-2 lg:mt-10 lg:mb-10 gap-2">
            <div id="test"
                class="!flex !flex-col !items-center !h-95  !w-[282px]  rounded-lg shadow-sm !bg-gray-800 !border-gray-700 swiper-slide glass glass_carusel">
                <div>
                    <span id="discount_percent"
                        class="!absolute opacity-0 !z-50 top-0.5 left-1 glass glass_carusel p-3 offer_card text-sm font-bold flex items-center bg-[#ff00003b]"></span>
                    <span id="condition"
                        class="!absolute !z-50 top-0.5 right-0.5 glass glass_carusel py-2 px-3  offer_card_right text-sm font-bold flex items-center bg-[#ff00003b]">
                    </span>
                </div>
                <a href="#">
                    <div class="!h-45 !relative !top-0">
                        <img id="image" class="p-3 rounded-t-lg   flex justify-center items-center"
                            src="image_glass/glassimage.jpg" alt="product image" />
                    </div>
                </a>
                <div class="px-5 pb-5">
                    <a href="#">
                        <h5 id="title" class="text-xl font-semibold h-21 tracking-tight text-white line-clamp-3">
                            Lorem ipsum dolor sit, amet consectetur adipisicing elit.</h5>
                    </a>
                    <div class="flex items-center mt-2.5 mb-5">
                        <div class="flex items-center space-x-1 rtl:space-x-reverse">
                            <svg class="w-4 h-4 text-yellow-300" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                fill="currentColor" viewBox="0 0 22 20">
                                <path
                                    d="M20.924 7.625a1.523 1.523 0 0 0-1.238-1.044l-5.051-.734-2.259-4.577a1.534 1.534 0 0 0-2.752 0L7.365 5.847l-5.051.734A1.535 1.535 0 0 0 1.463 9.2l3.656 3.563-.863 5.031a1.532 1.532 0 0 0 2.226 1.616L11 17.033l4.518 2.375a1.534 1.534 0 0 0 2.226-1.617l-.863-5.03L20.537 9.2a1.523 1.523 0 0 0 .387-1.575Z" />
                            </svg>
                            <svg class="w-4 h-4 text-yellow-300" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                fill="currentColor" viewBox="0 0 22 20">
                                <path
                                    d="M20.924 7.625a1.523 1.523 0 0 0-1.238-1.044l-5.051-.734-2.259-4.577a1.534 1.534 0 0 0-2.752 0L7.365 5.847l-5.051.734A1.535 1.535 0 0 0 1.463 9.2l3.656 3.563-.863 5.031a1.532 1.532 0 0 0 2.226 1.616L11 17.033l4.518 2.375a1.534 1.534 0 0 0 2.226-1.617l-.863-5.03L20.537 9.2a1.523 1.523 0 0 0 .387-1.575Z" />
                            </svg>
                            <svg class="w-4 h-4 text-yellow-300" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                fill="currentColor" viewBox="0 0 22 20">
                                <path
                                    d="M20.924 7.625a1.523 1.523 0 0 0-1.238-1.044l-5.051-.734-2.259-4.577a1.534 1.534 0 0 0-2.752 0L7.365 5.847l-5.051.734A1.535 1.535 0 0 0 1.463 9.2l3.656 3.563-.863 5.031a1.532 1.532 0 0 0 2.226 1.616L11 17.033l4.518 2.375a1.534 1.534 0 0 0 2.226-1.617l-.863-5.03L20.537 9.2a1.523 1.523 0 0 0 .387-1.575Z" />
                            </svg>
                            <svg class="w-4 h-4 text-yellow-300" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                fill="currentColor" viewBox="0 0 22 20">
                                <path
                                    d="M20.924 7.625a1.523 1.523 0 0 0-1.238-1.044l-5.051-.734-2.259-4.577a1.534 1.534 0 0 0-2.752 0L7.365 5.847l-5.051.734A1.535 1.535 0 0 0 1.463 9.2l3.656 3.563-.863 5.031a1.532 1.532 0 0 0 2.226 1.616L11 17.033l4.518 2.375a1.534 1.534 0 0 0 2.226-1.617l-.863-5.03L20.537 9.2a1.523 1.523 0 0 0 .387-1.575Z" />
                            </svg>
                            <svg class="w-4 h-4 text-gray-200 dark:text-gray-600" aria-hidden="true"
                                xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 22 20">
                                <path
                                    d="M20.924 7.625a1.523 1.523 0 0 0-1.238-1.044l-5.051-.734-2.259-4.577a1.534 1.534 0 0 0-2.752 0L7.365 5.847l-5.051.734A1.535 1.535 0 0 0 1.463 9.2l3.656 3.563-.863 5.031a1.532 1.532 0 0 0 2.226 1.616L11 17.033l4.518 2.375a1.534 1.534 0 0 0 2.226-1.617l-.863-5.03L20.537 9.2a1.523 1.523 0 0 0 .387-1.575Z" />
                            </svg>
                        </div>
                        <span
                            class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-sm dark:bg-blue-200 dark:text-blue-800 ms-3">5.0</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span id="price"
                            class="price text-[1rem] font-bold text-gray-900 dark:text-white flex me-1">$599<span
                                id="opponent" class="text-sm line-through ms-0.5">$200</span></span>
                        <button onmouseover="this.classList.remove('glass_carusel')"
                            onmouseout="this.classList.add('glass_carusel')"
                            class="cursor-pointer !text-[#d3c9fc] font-bold transition-all duration-500 !hover:bg-blue-800  focus:outline-none   rounded-lg text-base px-5 py-2.5 text-center flex items-center  glass glass_carusel"
                            id_parent="test">Add
                            to cart</button>
                    </div>
                </div>
            </div>

            <div class="!w-[300px] glass glass_carusel p-2 shrink-0 !h-96">
                <div class="px-2 py-3 flex flex-col  gap-4 justify-center">
                    <button id="save"
                        class="!absolute glass glass_carusel w-fit p-3 flex items-center top-2 left-1 hover:cursor-pointer"
                        onmouseover="this.classList.remove('glass_carusel')"
                        onmouseout="this.classList.add('glass_carusel')"><i
                            class="fa-solid fa-floppy-disk"></i></button>
                    <div class="flex items-center justify-center w-full">
                        <label for="dropzone-file"
                            class="flex flex-col items-center justify-center w-40 h-40 bg-neutral-secondary-medium border border-dashed border-default-strong rounded-base cursor-pointer hover:bg-neutral-tertiary-medium">
                            <div class="flex flex-col items-center justify-center text-body pt-5 pb-6 px-5">
                                <svg class="w-8 h-8 mb-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                    width="24" height="24" fill="none" viewBox="0 0 24 24">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M15 17h3a3 3 0 0 0 0-6h-.025a5.56 5.56 0 0 0 .025-.5A5.5 5.5 0 0 0 7.207 9.021C7.137 9.017 7.071 9 7 9a4 4 0 1 0 0 8h2.167M12 19v-9m0 0-2 2m2-2 2 2" />
                                </svg>
                                <p class="mb-2 text-sm"><span class="font-semibold">Click to upload</span> or drag and
                                    drop
                                </p>
                                <p class="text-xs">SVG, PNG, JPG or GIF (MAX. 800x400px)</p>
                            </div>
                            <input id="dropzone-file" type="file" multiple class="opacity-0" />
                        </label>
                    </div>
                    <!-- Description -->
                    <div class="relative">
                        <input id="Description" type="text" id="floating_outlined"
                            class="glass block px-2.5 pb-2.5 pt-4 w-full text-sm text-heading bg-transparent rounded-lg border-1 border-default-medium appearance-none focus:outline-none focus:ring-0 focus:border-brand peer"
                            placeholder=" ">
                        <label for="Description"
                            class="absolute text-sm text-body duration-300 transform -translate-y-4 scale-75 top-2 z-10 origin-[0] bg-[#5E5C89] rounded-md px-2 peer-focus:px-2 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-4 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto start-1">Description</label>
                    </div>

                    <div class="flex flex-wrap gap-2 justify-between">
                        <!-- Price -->
                        <div class="relative w-[calc(50%-0.5rem)]">
                            <input id="_price" type="number"
                                class="glass block px-2.5 pb-2.5 pt-4 w-full text-sm text-heading bg-transparent rounded-lg border-1 border-default-medium appearance-none focus:outline-none focus:ring-0 focus:border-brand peer"
                                placeholder=" ">
                            <label for="_price"
                                class="absolute text-xs text-body duration-300 transform -translate-y-4 scale-75 top-2 z-10 origin-[0] bg-[#5E5C89] rounded-md px-2 peer-focus:px-2 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-4 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto start-1">Price</label>
                        </div>
                        <!-- discount_percent -->
                        <div class="relative w-[calc(50%-0.5rem)]">
                            <input id="_discount_percent" type="number" maxlength="3" max="100"
                                class="glass block px-2.5 pb-2.5 pt-4 w-full text-sm text-heading bg-transparent rounded-lg border-1 border-default-medium appearance-none focus:outline-none focus:ring-0 focus:border-brand peer"
                                placeholder=" ">
                            <label for="_discount_percent"
                                class="absolute text-xs text-body duration-300 transform -translate-y-4 scale-75 top-2 z-10 origin-[0] bg-[#5E5C89] rounded-md px-2 peer-focus:px-2 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-4 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto start-1">opponent</label>
                        </div>

                        <!-- condition -->
                        <div class="relative w-full flex justify-between">
                            <div
                                class="py-2 px-7 glass glass_carusel flex items-center gap-1 contenier_raido hover:cursor-pointer hover:bg-[#00ff153b]">
                                <input class="hidden" type="radio" name="condition" id="A" value="A">
                                <label class="hover:cursor-pointer" for="A">A</label>
                            </div>

                            <div
                                class="py-2 px-7 glass glass_carusel flex items-center gap-1 contenier_raido hover:cursor-pointer hover:bg-[#fffb0052]">
                                <input class="hidden" type="radio" name="condition" id="B" value="B">
                                <label class="hover:cursor-pointer" for="B">B</label>
                            </div>

                            <div
                                class="py-2 px-7 glass glass_carusel flex items-center gap-1 contenier_raido hover:cursor-pointer hover:bg-[#ff00003b]">
                                <input class="hidden" type="radio" name="condition" id="C" value="C">
                                <label class="hover:cursor-pointer" for="C">C</label>
                            </div>
                        </div>
                        <div class=" glass glass_carusel py-3 px-1 w-fit  !absolute top-2 right-1 flex items-center  ">
                            <select id="countries_select"
                                class=" text-heading text-sm border-none outline-none appearance-none text-center">
                                <option class="bg-[#5D678A] text-[#B3A6D0]" selected disabled>Brand</option>
                                <option class="bg-[#5D678A]" value="Apple">Apple</option>
                                <option class="bg-[#5D678A]" value="Android">Android</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    

</body>
<script src="/../js/SharedFile.js"></script>
<script src="/../js/products.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/../js/edit&delete.js"></script>

</html>
