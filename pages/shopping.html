<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping</title>
    <link href="/../style/output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/../style/swiper.css">
    <link rel="stylesheet" href="/../style/stylecust.css">
    <link rel="icon" type="image/png" href="/image/logo.png"/>
</head>

<body class="bg-gray-900">
    <!-- nav -->
    <div class="flex justify-center">
        <nav id="header"
            class="container mx-auto flex fixed top-0 items-center justify-between md:px-0 !ps-2 !pe-4 !-top-[2.5px] z-50">
            <div>
                <img src="/../image/logo.png" alt="" width="90">
            </div>
            <div id="links_nav"
                class=" link_glass glass_link before:top-0.5 pt-2 pb-2 px-15 relative flex items-center me-1">
                <a href="#apple" onmouseover="this.classList.remove('glass_link')"
                    onmouseout="this.classList.add('glass_link')"
                    class="!text-[#4400ff59] font-bold link_nav link_glass glass_link hidden  apple p-3 flex items-center justify-center !rounded-b-none after:!rounded-b-none before:!rounded-b-none  ">Apple</a>
            </div>
            <div id="div_search"
                class="w-9 h-10 flex items-center glass px-2  transition-all duration-1000 ease-[cubic-bezier(0.36,0,0.66,-0.56)]">
                <i id="icon_search" class="fa-brands fa-searchengin text-2xl  !text-[#ffffff63]"></i>
                <input id="input_search" class=" outline-none w-full p-2 hidden" type="search" name="" id=""
                    placeholder="Search">
            </div>
        </nav>


    </div>

    <!-- shopping -->
    <div class="!flex flex-col !justify-center !items-center mt-17 mb-5 relative">

        <div class="py-3 px-5 text-black absolute text-center glass glass_carusel bg-[#00ff153b] flex justify-center items-center w-50/51 sm:w-11/13 md:w-11/14 lg:w-11/15 !h-fit
                    !rounded-b-none after:!rounded-b-none before:!rounded-b-none hover:cursor-pointer z-50" onclick="buying()">
            <i class="fa-solid fa-cart-shopping"></i>
        </div>

        <div id="shopping_continar"
            class="transition-all duration-500 ease-in-out h-[80vh] glass glass_carusel w-50/51 sm:w-11/13 md:w-11/14 lg:w-11/15
            !rounded-t-none after:!rounded-t-none before:!rounded-t-none">
            <div id="shopping" class="py-5 flex flex-col gap-2  !overflow-y-auto !max-h-20/22 ">
                <!-- items shopp -->

            </div>
            <div id="total_price_parent"
                class="glass glass_carusel flex justify-center items-center p-2 !text-[#ffffff85] font-semibold">
                total $<span id="total_price">0</span>
            </div>
        </div>

    </div>




</body>
<script src="/../js/SharedFile.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/../js/scirptPageShopping.js"></script>
</html>
